name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # `npm ci` installs from the lockfile. Do not swap this for `npm install`:
      # npm 10's peer resolver crashes building vitest 4's ideal tree from scratch.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Two independent models of the same maths. If they ever disagree, the
      # golden cases in the plan are wrong and the build stops.
      - run: python3 tools/oracle.py
      # The engine's tests assert against a fixture the oracle emits. If
      # regenerating it changes anything, the two implementations have drifted.
      - run: python3 tools/oracle.py --emit
      - run: git diff --exit-code tools/golden-cases.json

  # Every push to main that passes both jobs goes live at tinypercent.com. Runs
  # only in the private repository; the public portfolio copy never deploys.
  # Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'andriuskleinas/startup-investment-calculator'
    needs: [check, oracle]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v5
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
