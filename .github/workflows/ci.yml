name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # `npm ci` installs from the lockfile. Do not swap this for `npm install`:
      # npm 10's peer resolver crashes building vitest 4's ideal tree from scratch.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Two independent models of the same maths. If they ever disagree, the
      # golden cases in the plan are wrong and the build stops.
      - run: python3 tools/oracle.py
      # The engine's tests assert against a fixture the oracle emits. If
      # regenerating it changes anything, the two implementations have drifted.
      - run: python3 tools/oracle.py --emit
      - run: git diff --exit-code tools/golden-cases.json
